{% extends 'inventory/base.html' %}

{% block content %}

<h2>Stock Out List</h2>

<table class="table table-bordered table-striped">

    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Product</th>
            <th>Quantity</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody>

        {% for stockout in stockouts %}

        <tr>
            <td>{{ stockout.id }}</td>
            <td>{{ stockout.product }}</td>
            <td>{{ stockout.quantity }}</td>
            <td>{{ stockout.date }}</td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="4" class="text-center">
                No Stock Out Records
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
